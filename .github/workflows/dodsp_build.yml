#
# DOD-SP build
#
# Builds the HL2 (Mapbase) client.dll and server.dll for DOD-SP on every push to master
# that touches game code. Download the result from the Actions tab:
#   Actions -> "DOD-SP Build" -> newest run -> Artifacts -> game_hl2_win32_Release
# Unzip it and copy client.dll + server.dll into sourcemods\DOD-SP\bin (back up the old ones first).
#
# Can also be started by hand: Actions -> "DOD-SP Build" -> "Run workflow".
#
# The second artifact, maptools_win32_Release, is Mapbase's map compilers (vbsp, vvis, vrad)
# built from this repo. Hammer needs them for Mapbase's SDK_ shaders: the stock SDK 2013 tools
# baked those faces with no lightmap (flat, full bright). Stage 3 of the sun shadows also
# changes VRAD, so the compilers come from here.
#
# The third artifact, shaders_hl2_win32_Release, is DOD-SP's own game_shader_dx9.dll (Mapbase's
# shader source plus our changes). It goes into sourcemods\DOD-SP\bin and replaces Mapbase's copy
# (the engine loads the first game_shader_dx9.dll on the bin search path). Delete it to go back.
# "dodsp_shadercheck" reports which one is loaded.

name: DOD-SP Build

on:
  push:
    branches:
      - master
    paths:
      - '.github/workflows/dodsp_build.yml'
      - '.github/workflows/mapbase_build-base.yml'
      - 'sp/src/vpc_scripts/**'
      - 'sp/src/game/**'
      - 'sp/src/mathlib/**'
      - 'sp/src/responserules/runtime/**'
      - 'sp/src/tier1/**'
      - 'sp/src/vgui2/vgui_controls/**'
      - 'sp/src/vscript/**'
      - 'sp/src/utils/**'
      - 'sp/src/materialsystem/**'
      - 'dodsp_tools/lint_shader_registers.py'
  workflow_dispatch:

jobs:
  games:
    uses: ./.github/workflows/mapbase_build-base.yml
    with:
      configuration: Release
      branch: 'sp'
      game: 'hl2'            # DOD-SP is built on mapbase_hl2
      project-group: 'game'
      solution-name: 'games'
      build-on-linux: false  # Windows only

  maptools:
    uses: ./.github/workflows/mapbase_build-base.yml
    with:
      configuration: Release
      branch: 'sp'
      project-group: 'maptools'
      solution-name: 'maptools'
      build-on-linux: false

  shader-lint:
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v4
    - name: Check shader constant registers
      run: python3 dodsp_tools/lint_shader_registers.py sp/src/materialsystem/stdshaders

  shaders:
    needs: shader-lint
    uses: ./.github/workflows/mapbase_build-base.yml
    with:
      configuration: Release
      branch: 'sp'
      game: 'hl2'
      project-group: 'shaders'
      solution-name: 'shaders'
      build-on-linux: false
