#
# DOD-SP shaders
#
# Compiles the shaders listed in sp/src/materialsystem/stdshaders/dodsp_shaderlist.txt with the
# standalone ShaderCompile (SCell555, pinned), for ps/vs 2.0b and 3.0, then checks every result
# against the DLL's combo headers (dodsp_tools/check_vcs.py - the build fails on a mismatch).
# Artifact "dodsp_shaders": the .vcs files -> sourcemods\DOD-SP\shaders\fxc\
# Artifact "dodsp_shaders_canary": the same shaders with the projected light tinted RED - a
# 30-second in-game proof that the game loads our .vcs files (red sun patch = ours). Test only.
#
name: DOD-SP Shaders

on:
  push:
    branches:
      - master
    paths:
      - '.github/workflows/dodsp_shaders.yml'
      - 'sp/src/materialsystem/stdshaders/**'
      - 'dodsp_tools/check_vcs.py'
  workflow_dispatch:

jobs:
  shaders:
    runs-on: windows-latest
    timeout-minutes: 300
    steps:
    - uses: actions/checkout@v4

    - name: Get ShaderCompile
      uses: actions/checkout@v4
      with:
        repository: SCell555/ShaderCompile
        ref: 7ea74828baa22df9db5efad67b48abb7c5b3dbed
        submodules: recursive
        path: tools/ShaderCompile

    - name: Build ShaderCompile
      shell: pwsh
      run: |
        cmake -S tools/ShaderCompile -B tools/ShaderCompile/build -A x64
        cmake --build tools/ShaderCompile/build --config Release --parallel

    - name: Compile shaders
      shell: pwsh
      run: |
        $sc = (Get-ChildItem tools/ShaderCompile/build -Recurse -Filter ShaderCompile.exe | Select-Object -First 1).FullName
        if (-not $sc) { throw "ShaderCompile.exe not built" }
        $dir = (Resolve-Path "sp/src/materialsystem/stdshaders").Path
        $list = Get-Content "$dir/dodsp_shaderlist.txt" | ForEach-Object { $_.Trim() } | Where-Object { $_ -and -not $_.StartsWith("//") }
        foreach ($ver in "20b", "30") {
          foreach ($fxc in $list) {
            Write-Host "== $fxc ($ver)"
            & $sc -ver $ver -shaderpath $dir $fxc
            if ($LASTEXITCODE -ne 0) { throw "ShaderCompile failed: $fxc $ver" }
          }
        }
        Get-ChildItem "$dir/shaders/fxc" | Format-Table Name, Length

    - name: Compile canary (red-tinted proof)
      shell: pwsh
      run: |
        $sc = (Get-ChildItem tools/ShaderCompile/build -Recurse -Filter ShaderCompile.exe | Select-Object -First 1).FullName
        $src = (Resolve-Path "sp/src/materialsystem/stdshaders").Path
        $dir = "$env:RUNNER_TEMP/canary"
        New-Item -ItemType Directory $dir | Out-Null
        Get-ChildItem $src -File | Copy-Item -Destination $dir
        $f = "$dir/SDK_lightmappedgeneric_flashlight_ps2x.fxc"
        $old = 'return FinalOutput( float4(outColor, baseColor.a)'
        $txt = Get-Content $f -Raw
        if (-not $txt.Contains($old)) { throw "INVARIANT: canary patch point not found in $f" }
        Set-Content $f ($txt.Replace($old, 'outColor *= float3(1.0, 0.1, 0.1); // DOD-SP canary' + "`n`t" + $old)) -NoNewline
        foreach ($ver in "20b", "30") {
          & $sc -ver $ver -shaderpath $dir SDK_lightmappedgeneric_flashlight_ps2x.fxc
          if ($LASTEXITCODE -ne 0) { throw "canary compile failed ($ver)" }
        }
        New-Item -ItemType Directory canary_out | Out-Null
        Copy-Item "sp/src/materialsystem/stdshaders/shaders/fxc/*vs*.vcs" canary_out/
        Copy-Item "$dir/shaders/fxc/*.vcs" canary_out/
        python dodsp_tools/check_vcs.py canary_out sp/src/materialsystem/stdshaders
        if ($LASTEXITCODE -ne 0) { throw "canary does not match the DLL" }

    - name: Check shaders match the DLL
      run: python dodsp_tools/check_vcs.py sp/src/materialsystem/stdshaders/shaders/fxc sp/src/materialsystem/stdshaders

    - name: Publish
      uses: actions/upload-artifact@v4
      with:
        name: dodsp_shaders
        path: sp/src/materialsystem/stdshaders/shaders/fxc/*.vcs
        if-no-files-found: error

    - name: Publish canary
      uses: actions/upload-artifact@v4
      with:
        name: dodsp_shaders_canary
        path: canary_out/*.vcs
        if-no-files-found: error
