#
# DOD-SP shaders
#
# Compiles the shaders listed in sp/src/materialsystem/stdshaders/dodsp_shaderlist.txt with the
# standalone ShaderCompile (SCell555, pinned). One job per shader and version, all in parallel,
# so the wait is the slowest single shader rather than the sum. A shader whose sources (the .fxc
# and every header it includes) did not change is restored from cache instead of recompiled
# (dodsp_tools/shader_jobs.py builds the job list and keys).
# The publish job checks every result against the DLL's combo headers (dodsp_tools/check_vcs.py,
# the build fails on a mismatch) and uploads one artifact.
# Artifact "dodsp_shaders": the .vcs files -> sourcemods\DOD-SP\shaders\fxc\
#
name: DOD-SP Shaders

on:
  push:
    branches:
      - master
    paths:
      - '.github/workflows/dodsp_shaders.yml'
      - 'sp/src/materialsystem/stdshaders/**'
      - 'dodsp_tools/check_vcs.py'
      - 'dodsp_tools/lint_shader_registers.py'
      - 'dodsp_tools/shader_jobs.py'
  workflow_dispatch:

env:
  SHADERCOMPILE_REF: 7ea74828baa22df9db5efad67b48abb7c5b3dbed

jobs:
  plan:
    runs-on: ubuntu-latest
    outputs:
      matrix: ${{ steps.plan.outputs.matrix }}
    steps:
    - uses: actions/checkout@v4

    # Seconds, not hours: pixel constants past c31 or a shader/DLL register mismatch fail here,
    # before any compile starts.
    - name: Check shader constant registers
      run: python3 dodsp_tools/lint_shader_registers.py sp/src/materialsystem/stdshaders

    - name: Plan the shader jobs
      id: plan
      run: |
        python3 dodsp_tools/shader_jobs.py sp/src/materialsystem/stdshaders "$SHADERCOMPILE_REF" > matrix.json
        python3 -c "import json; [print(j['name'], j['key']) for j in json.load(open('matrix.json'))['include']]"
        echo "matrix=$(cat matrix.json)" >> "$GITHUB_OUTPUT"

  compile:
    needs: plan
    runs-on: windows-latest
    timeout-minutes: 300
    strategy:
      fail-fast: true   # one broken shader stops the rest - no point waiting an hour for a failed build
      matrix: ${{ fromJson(needs.plan.outputs.matrix) }}
    name: ${{ matrix.name }}
    steps:
    - uses: actions/checkout@v4

    - name: Reuse the compiled shader if its sources did not change
      id: vcs
      uses: actions/cache/restore@v4
      with:
        path: out
        key: ${{ matrix.key }}

    - name: Get ShaderCompile
      if: steps.vcs.outputs.cache-hit != 'true'
      uses: actions/checkout@v4
      with:
        repository: SCell555/ShaderCompile
        ref: ${{ env.SHADERCOMPILE_REF }}
        submodules: recursive
        path: tools/ShaderCompile

    - name: Reuse the built ShaderCompile
      if: steps.vcs.outputs.cache-hit != 'true'
      id: sc
      uses: actions/cache@v4
      with:
        path: tools/ShaderCompile/build
        key: shadercompile-${{ env.SHADERCOMPILE_REF }}

    - name: Build ShaderCompile
      if: steps.vcs.outputs.cache-hit != 'true' && steps.sc.outputs.cache-hit != 'true'
      shell: pwsh
      run: |
        cmake -S tools/ShaderCompile -B tools/ShaderCompile/build -A x64
        cmake --build tools/ShaderCompile/build --config Release --parallel

    - name: Compile ${{ matrix.fxc }} (${{ matrix.ver }})
      if: steps.vcs.outputs.cache-hit != 'true'
      shell: pwsh
      run: |
        $sc = (Get-ChildItem tools/ShaderCompile/build -Recurse -Filter ShaderCompile.exe | Select-Object -First 1).FullName
        if (-not $sc) { throw "ShaderCompile.exe not built" }
        $dir = (Resolve-Path "sp/src/materialsystem/stdshaders").Path
        $t = [Diagnostics.Stopwatch]::StartNew()
        & $sc -ver ${{ matrix.ver }} -shaderpath $dir ${{ matrix.fxc }}
        if ($LASTEXITCODE -ne 0) { throw "ShaderCompile failed: ${{ matrix.fxc }} ${{ matrix.ver }}" }
        Write-Host ("   took {0:N1} min" -f $t.Elapsed.TotalMinutes)
        New-Item -ItemType Directory -Force out | Out-Null
        Copy-Item "$dir/shaders/fxc/*.vcs" out/
        Get-ChildItem out | Format-Table Name, Length
        # INVARIANT: one job, one shader file
        if ((Get-ChildItem out -Filter *.vcs).Count -ne 1) { throw "INVARIANT: expected exactly one .vcs from ${{ matrix.name }}" }

    - name: Save the compiled shader for next time
      if: steps.vcs.outputs.cache-hit != 'true'
      uses: actions/cache/save@v4
      with:
        path: out
        key: ${{ matrix.key }}

    - name: Hand the shader to the publish job
      uses: actions/upload-artifact@v4
      with:
        name: vcs-${{ matrix.name }}
        path: out/*.vcs
        if-no-files-found: error
        retention-days: 1

  publish:
    needs: [plan, compile]
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v4

    - name: Collect every shader
      uses: actions/download-artifact@v4
      with:
        pattern: vcs-*
        merge-multiple: true
        path: fxc

    - name: Check shaders match the DLL
      env:
        MATRIX: ${{ needs.plan.outputs.matrix }}
      run: |
        # INVARIANT: every planned shader arrived (a job that silently produced nothing fails here)
        want=$(python3 -c "import json,os; print(len(json.loads(os.environ['MATRIX'])['include']))")
        got=$(ls fxc/*.vcs | wc -l)
        echo "planned $want shaders, collected $got"
        if [ "$want" != "$got" ]; then echo "INVARIANT: planned $want shaders but collected $got"; exit 1; fi
        python3 dodsp_tools/check_vcs.py fxc sp/src/materialsystem/stdshaders

    - name: Publish
      uses: actions/upload-artifact@v4
      with:
        name: dodsp_shaders
        path: fxc/*.vcs
        if-no-files-found: error
